name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
      node-services: ${{ steps.filter.outputs.node-services }}
      python-services: ${{ steps.filter.outputs.python-services }}
      rust-services: ${{ steps.filter.outputs.rust-services }}
      security-critical: ${{ steps.filter.outputs.security-critical }}

    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4.6.0

      - name: Check for file changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            docs-only:
              - 'docs/**'
              - '*.md'
              - 'mkdocs.yml'
            node-services:
              - 'apps/**/package*.json'
              - 'apps/**/tsconfig*.json'
              - 'apps/**/*.ts'
              - 'apps/**/*.js'
            python-services:
              - 'apps/**/requirements*.txt'
              - 'apps/**/*.py'
              - 'apps/**/pyproject.toml'
            rust-services:
              - 'apps/**/Cargo.toml'
              - 'apps/**/Cargo.lock'
              - 'apps/**/*.rs'
            security-critical:
              - 'apps/security/**'
              - '.github/workflows/**'
              - 'infrastructure/**'

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' || github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Node.js Services"
            node-version: "20.x"
            python-version: "3.12"
            rust-version: "stable"
            enable-node: true
            enable-python: true
            enable-rust: false
          - name: "Security Services (Enhanced)"
            node-version: "20.x"
            python-version: "3.12"
            rust-version: "stable"
            enable-node: true
            enable-python: true
            enable-rust: true
            security-enhanced: true

    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4.6.0
        with:
          fetch-depth: 1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Setup Python ${{ matrix.python-version }}
        if: matrix.enable-python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Setup Rust ${{ matrix.rust-version }}
        if: matrix.enable-rust
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350aa60abc8 # stable
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 8

      - name: Cache dependencies
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/pip
            ~/.nx
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-deps-${{ matrix.name }}-${{ hashFiles('**/pnpm-lock.yaml', '**/requirements*.txt', '**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.name }}-${{ hashFiles('**/pnpm-lock.yaml', '**/requirements*.txt', '**/Cargo.lock') }}-
            ${{ runner.os }}-deps-${{ matrix.name }}-
            ${{ runner.os }}-deps-

      - name: Install Node.js dependencies
        if: matrix.enable-node && (needs.changes.outputs.node-services == 'true' || github.event_name != 'pull_request')
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        if: matrix.enable-python && (needs.changes.outputs.python-services == 'true' || github.event_name != 'pull_request')
        run: |
          # Install global Python dependencies
          pip install --upgrade pip setuptools wheel

          # Install dependencies for detected Python services
          find apps -name "requirements*.txt" -type f | while read req_file; do
            echo "Installing dependencies from $req_file"
            pip install -r "$req_file"
          done

          # Install development tools for enhanced security testing
          if [[ "${{ matrix.security-enhanced }}" == "true" ]]; then
            pip install bandit safety black flake8 pytest pytest-cov semgrep
          fi

      - name: Build Rust dependencies
        if: matrix.enable-rust && (needs.changes.outputs.rust-services == 'true' || github.event_name != 'pull_request')
        run: |
          # Check Rust formatting
          find apps -name "Cargo.toml" -type f | while read cargo_file; do
            cargo_dir=$(dirname "$cargo_file")
            echo "Checking Rust formatting in $cargo_dir"
            (cd "$cargo_dir" && cargo fmt --check)
          done

          # Build Rust projects
          find apps -name "Cargo.toml" -type f | while read cargo_file; do
            cargo_dir=$(dirname "$cargo_file")
            echo "Building Rust project in $cargo_dir"
            (cd "$cargo_dir" && cargo build --release)
          done

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4

      - name: Run Node.js linters
        if: matrix.enable-node && (needs.changes.outputs.node-services == 'true' || github.event_name != 'pull_request')
        run: npx nx affected --target=lint --parallel=3
        continue-on-error: false

      - name: Run Python linters and security checks
        if: matrix.enable-python && (needs.changes.outputs.python-services == 'true' || github.event_name != 'pull_request')
        run: |
          # Run Python security and quality checks
          find apps -name "*.py" -path "*/apps/*" | head -1 > /dev/null && {
            echo "Running Python linting and security checks"
            
            # Security scanning with bandit (if security-enhanced)
            if [[ "${{ matrix.security-enhanced }}" == "true" ]]; then
              bandit -r apps/ -f json -o bandit-report.json --skip B101 || true
              echo "Bandit security scan completed"
            fi
            
            # Code quality with flake8
            flake8 apps/ --exclude=node_modules,venv --max-line-length=88 --extend-ignore=E203,W503 || true
            
            # Format checking with black
            black --check apps/ --exclude="/(node_modules|venv)/" || true
          }

      - name: Run Rust linters
        if: matrix.enable-rust && (needs.changes.outputs.rust-services == 'true' || github.event_name != 'pull_request')
        run: |
          find apps -name "Cargo.toml" -type f | while read cargo_file; do
            cargo_dir=$(dirname "$cargo_file")
            echo "Running Rust lints in $cargo_dir"
            (cd "$cargo_dir" && cargo clippy -- -D warnings)
          done

      - name: Run comprehensive tests
        run: |
          # Enhanced security testing for security domain
          if [[ "${{ matrix.security-enhanced }}" == "true" && "${{ needs.changes.outputs.security-critical }}" == "true" ]]; then
            echo "🔒 Running enhanced security tests"
            npx nx affected --target=test --parallel=2 --ci --coverage
            
            # Additional security-specific tests
            npm run test:security 2>/dev/null || echo "ℹ️  No security-specific tests defined"
            
            # Run Python security tests if available
            if [[ "${{ matrix.enable-python }}" == "true" ]]; then
              find apps -name "test_security*.py" -o -name "*_security_test.py" | head -1 > /dev/null && {
                python -m pytest apps/ -k "security" --tb=short || echo "ℹ️  No Python security tests found"
              }
            fi
          else
            echo "⚡ Running standard tests"
            npx nx affected --target=test --parallel=3 --ci --coverage
          fi
        continue-on-error: false

      - name: Run Rust tests
        if: matrix.enable-rust && (needs.changes.outputs.rust-services == 'true' || github.event_name != 'pull_request')
        run: |
          find apps -name "Cargo.toml" -type f | while read cargo_file; do
            cargo_dir=$(dirname "$cargo_file")
            echo "Running Rust tests in $cargo_dir"
            (cd "$cargo_dir" && cargo test --release)
          done
        continue-on-error: false

      - name: Build applications
        run: |
          # Build with domain-specific optimizations
          if [[ "${{ matrix.security-enhanced }}" == "true" ]]; then
            echo "🔒 Building with security optimizations"
            npx nx affected --target=build --parallel=2 --configuration=production
          else
            echo "⚡ Building standard configuration"
            npx nx affected --target=build --parallel=3
          fi
        continue-on-error: false

      - name: Upload security scan results
        if: always() && matrix.security-enhanced == true && hashFiles('bandit-report.json') != ''
        uses: github/codeql-action/upload-sarif@e2b3eafc8d227b0241d48be5f425d47c2d750a13 # v3.26.10
        with:
          sarif_file: "bandit-report.json"
        continue-on-error: true

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673 # v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4.6.0
        with:
          fetch-depth: 1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b9ceecfd3 # 0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          timeout: "10m"

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@e2b3eafc8d227b0241d48be5f425d47c2d750a13 # v3.26.10
        with:
          sarif_file: "trivy-results.sarif"
