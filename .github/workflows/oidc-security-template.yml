name: OIDC Security Template

# This is a reusable workflow template demonstrating OIDC best practices
# for secure cloud authentication without long-lived secrets

on:
    workflow_call:
        inputs:
            cloud-provider:
                description: "Cloud provider (aws, azure, gcp)"
                required: true
                type: string
            role-to-assume:
                description: "Cloud role ARN/ID to assume via OIDC"
                required: true
                type: string
            region:
                description: "Cloud region"
                required: false
                type: string
                default: "us-east-1"
            environment:
                description: "Deployment environment (staging, production)"
                required: true
                type: string
        outputs:
            deployment-url:
                description: "Deployment URL"
                value: ${{ jobs.deploy.outputs.url }}

permissions:
    id-token: write # Required for OIDC token exchange
    contents: read # Read repository contents
    deployments: write # Create deployment status

concurrency:
    group: oidc-deploy-${{ inputs.environment }}-${{ github.ref }}
    cancel-in-progress: false

env:
    # Domain-specific timeout configurations
    SECURITY_TIMEOUT: 45
    PRODUCTIVITY_TIMEOUT: 30
    INFRASTRUCTURE_TIMEOUT: 60

jobs:
    oidc-setup:
        name: OIDC Authentication Setup
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ${{ inputs.environment }}

        outputs:
            authenticated: ${{ steps.auth.outputs.success }}
            provider: ${{ inputs.cloud-provider }}

        steps:
            - name: Checkout code
              uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4.6.0
              with:
                  fetch-depth: 1

            - name: Configure AWS credentials via OIDC
              if: inputs.cloud-provider == 'aws'
              id: aws-auth
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
              with:
                  role-to-assume: ${{ inputs.role-to-assume }}
                  aws-region: ${{ inputs.region }}
                  role-session-name: GitHubActions-OIDC-${{ github.run_id }}
                  # Trust policy should be configured in AWS to trust GitHub's OIDC provider

            - name: Configure Azure credentials via OIDC
              if: inputs.cloud-provider == 'azure'
              id: azure-auth
              uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a # v2.1.1
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  # Uses OIDC token exchange instead of client secret

            - name: Configure GCP credentials via OIDC
              if: inputs.cloud-provider == 'gcp'
              id: gcp-auth
              uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ inputs.role-to-assume }}
                  # Uses Workload Identity Federation for secure authentication

            - name: Verify authentication
              id: auth
              timeout-minutes: 2
              run: |
                  set -euo pipefail

                  case "${{ inputs.cloud-provider }}" in
                    aws)
                      if aws sts get-caller-identity > /dev/null 2>&1; then
                        echo "✅ AWS OIDC authentication successful"
                        echo "success=true" >> $GITHUB_OUTPUT
                      else
                        echo "❌ AWS OIDC authentication failed"
                        echo "success=false" >> $GITHUB_OUTPUT
                        exit 1
                      fi
                      ;;
                    azure)
                      if az account show > /dev/null 2>&1; then
                        echo "✅ Azure OIDC authentication successful"
                        echo "success=true" >> $GITHUB_OUTPUT
                      else
                        echo "❌ Azure OIDC authentication failed" 
                        echo "success=false" >> $GITHUB_OUTPUT
                        exit 1
                      fi
                      ;;
                    gcp)
                      if gcloud auth list --filter=status:ACTIVE --format="value(account)" | grep -q .; then
                        echo "✅ GCP OIDC authentication successful"
                        echo "success=true" >> $GITHUB_OUTPUT
                      else
                        echo "❌ GCP OIDC authentication failed"
                        echo "success=false" >> $GITHUB_OUTPUT
                        exit 1
                      fi
                      ;;
                    *)
                      echo "❌ Unsupported cloud provider: ${{ inputs.cloud-provider }}"
                      echo "success=false" >> $GITHUB_OUTPUT
                      exit 1
                      ;;
                  esac

    security-validation:
        name: Security Validation
        runs-on: ubuntu-latest
        needs: oidc-setup
        if: needs.oidc-setup.outputs.authenticated == 'true'
        timeout-minutes: 15

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout code
              uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4.6.0
              with:
                  fetch-depth: 1

            - name: Run secret scanning
              uses: trufflesecurity/trufflehog@4eb27c751cfb5e68f85e9ee098b152fc3c307114 # v3.82.6
              with:
                  extra_args: --debug --only-verified

            - name: Dependency vulnerability scan
              uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b9ceecfd3 # 0.24.0
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "dependency-results.sarif"
                  severity: "CRITICAL,HIGH,MEDIUM"
                  timeout: "10m"

            - name: Upload security scan results
              if: always()
              uses: github/codeql-action/upload-sarif@e2b3eafc8d227b0241d48be5f425d47c2d750a13 # v3.26.10
              with:
                  sarif_file: "dependency-results.sarif"

    deploy:
        name: Secure Deployment
        runs-on: ubuntu-latest
        needs: [oidc-setup, security-validation]
        if: needs.oidc-setup.outputs.authenticated == 'true'
        environment:
            name: ${{ inputs.environment }}
            url: ${{ steps.deploy.outputs.url }}

        outputs:
            url: ${{ steps.deploy.outputs.url }}

        steps:
            - name: Create deployment
              id: deployment
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              with:
                  script: |
                      const deployment = await github.rest.repos.createDeployment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: context.sha,
                        environment: '${{ inputs.environment }}',
                        description: 'OIDC-secured deployment',
                        auto_merge: false,
                        required_contexts: []
                      });
                      return deployment.data.id;

            - name: Simulate secure deployment
              id: deploy
              timeout-minutes: 30
              run: |
                  set -euo pipefail

                  echo "🚀 Starting secure deployment to ${{ inputs.environment }}"
                  echo "Using OIDC authentication for ${{ inputs.cloud-provider }}"
                  echo "Role: ${{ inputs.role-to-assume }}"

                  # Simulate deployment process
                  sleep 5

                  # Generate deployment URL based on environment
                  case "${{ inputs.environment }}" in
                    production)
                      URL="https://prod.mental-prosthetic.com"
                      ;;
                    staging)
                      URL="https://staging.mental-prosthetic.com"
                      ;;
                    *)
                      URL="https://dev.mental-prosthetic.com"
                      ;;
                  esac

                  echo "✅ Deployment successful"
                  echo "url=$URL" >> $GITHUB_OUTPUT
                  echo "Deployed to: $URL"

            - name: Update deployment status
              if: always()
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              with:
                  script: |
                      const deploymentId = ${{ steps.deployment.outputs.result }};
                      const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';

                      await github.rest.repos.createDeploymentStatus({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        deployment_id: deploymentId,
                        state: state,
                        environment_url: '${{ steps.deploy.outputs.url }}',
                        description: `Deployment ${state} via OIDC`
                      });

    post-deployment-checks:
        name: Post-Deployment Security Validation
        runs-on: ubuntu-latest
        needs: deploy
        if: needs.deploy.outputs.url
        timeout-minutes: 10

        steps:
            - name: Health check
              timeout-minutes: 5
              run: |
                  set -euo pipefail

                  URL="${{ needs.deploy.outputs.url }}"
                  echo "🏥 Running health checks on $URL"

                  # Basic connectivity test
                  if curl -sSf --max-time 30 "$URL/health" > /dev/null 2>&1; then
                    echo "✅ Health check passed"
                  else
                    echo "⚠️  Health check failed - deployment may need attention"
                    exit 1
                  fi

            - name: Security headers check
              timeout-minutes: 3
              run: |
                  set -euo pipefail

                  URL="${{ needs.deploy.outputs.url }}"
                  echo "🔒 Checking security headers for $URL"

                  # Check for essential security headers
                  RESPONSE=$(curl -sI --max-time 30 "$URL" || true)

                  if echo "$RESPONSE" | grep -qi "X-Frame-Options\|Content-Security-Policy\|X-Content-Type-Options"; then
                    echo "✅ Security headers detected"
                  else
                    echo "⚠️  Missing security headers - consider adding CSP, X-Frame-Options, etc."
                  fi
