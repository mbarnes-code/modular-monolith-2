name: Unified CI/CD Pipeline

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the service being built"
        required: true
        type: string
      working-directory:
        description: "Working directory for the service"
        required: false
        type: string
        default: "."
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20.x"
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      skip-tests:
        description: "Skip test execution"
        required: false
        type: boolean
        default: false
      skip-lint:
        description: "Skip linting"
        required: false
        type: boolean
        default: false
      build-command:
        description: "Custom build command"
        required: false
        type: string
        default: "npm run build"
      test-command:
        description: "Custom test command"
        required: false
        type: string
        default: "npm test"
      domain:
        description: "Service domain for performance thresholds"
        required: false
        type: string
        default: "infrastructure"
    outputs:
      build-status:
        description: "Build completion status"
        value: ${{ jobs.build.outputs.status }}
      test-results:
        description: "Test execution results"
        value: ${{ jobs.test.outputs.results }}

env:
  # Domain-based performance thresholds
  TIMEOUT_SECURITY: 5 # Security domain: <1s target, 5min max
  TIMEOUT_PRODUCTIVITY: 15 # Productivity domain: <2s target, 15min max
  TIMEOUT_TCG: 20 # TCG domain: <3s target, 20min max
  TIMEOUT_INFRASTRUCTURE: 30 # Infrastructure domain: <5s target, 30min max

jobs:
  setup:
    name: Setup & Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.domain == 'security' && 5 || inputs.domain == 'productivity' && 15 || inputs.domain == 'tcg' && 20 || 30 }}

    outputs:
      cache-key: ${{ steps.cache.outputs.cache-key }}
      should-build: ${{ steps.changes.outputs.should-build }}

    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4.6.0
        with:
          fetch-depth: 1

      - name: Detect changes
        id: changes
        timeout-minutes: 2
        run: |
          # Use nx affected for more accurate change detection in monorepo
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="HEAD~1"
          fi

          if git diff --quiet $BASE_SHA HEAD -- ${{ inputs.working-directory }}; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "🔍 No changes detected in ${{ inputs.service-name }}"
          else
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected in ${{ inputs.service-name }}"
          fi

      - name: Generate cache key
        id: cache
        timeout-minutes: 2
        run: |
          # Generate more comprehensive cache key including lock files and configs
          FILES="${{ inputs.working-directory }}/**/package*.json ${{ inputs.working-directory }}/**/requirements*.txt ${{ inputs.working-directory }}/**/Cargo.lock ${{ inputs.working-directory }}/**/go.mod ${{ inputs.working-directory }}/**/nx.json"
          HASH=$(echo "$FILES" | xargs -r sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1 || echo 'no-files')
          CACHE_KEY="${{ runner.os }}-${{ inputs.service-name }}-${HASH}-${{ github.run_id }}"
          echo "cache-key=${CACHE_KEY}" >> $GITHUB_OUTPUT
          echo "🔑 Cache key: ${CACHE_KEY}"

  dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should-build == 'true'
    timeout-minutes: ${{ inputs.domain == 'security' && 5 || inputs.domain == 'productivity' && 15 || inputs.domain == 'tcg' && 20 || 30 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Setup Python
        if: hashFiles(format('{0}/**/requirements*.txt', inputs.working-directory)) != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ${{ inputs.working-directory }}/.venv
            ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.service-name }}-

      - name: Install Node.js dependencies
        if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            npm install --prefer-offline --no-audit
          fi

      - name: Install Python dependencies
        if: hashFiles(format('{0}/**/requirements*.txt', inputs.working-directory)) != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m venv .venv
          source .venv/bin/activate
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    needs: [setup, dependencies]
    if: needs.setup.outputs.should-build == 'true' && !inputs.skip-lint
    timeout-minutes: ${{ inputs.domain == 'security' && 5 || inputs.domain == 'productivity' && 15 || inputs.domain == 'tcg' && 20 || 30 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Python
        if: hashFiles(format('{0}/**/requirements*.txt', inputs.working-directory)) != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ${{ inputs.working-directory }}/.venv
            ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}

      - name: ESLint (TypeScript/JavaScript)
        if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          if npm list eslint &>/dev/null; then
            echo "🔍 Running ESLint..."
            npm run lint || npx eslint . --ext .ts,.js,.tsx,.jsx --max-warnings 0
          else
            echo "⏭️ ESLint not configured, skipping"
          fi

      - name: Prettier (TypeScript/JavaScript)
        if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          if npm list prettier &>/dev/null; then
            echo "🎨 Checking code formatting..."
            npx prettier --check . || npm run format:check
          else
            echo "⏭️ Prettier not configured, skipping"
          fi

      - name: Ruff (Python)
        if: hashFiles(format('{0}/**/requirements*.txt', inputs.working-directory)) != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          source .venv/bin/activate
          if pip list ruff &>/dev/null; then
            echo "🐍 Running Ruff linter..."
            ruff check .
            ruff format --check .
          else
            echo "⏭️ Ruff not installed, trying flake8..."
            if pip list flake8 &>/dev/null; then
              flake8 .
            fi
          fi

  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    needs: [setup, dependencies, lint]
    if: always() && needs.setup.outputs.should-build == 'true' && !cancelled()
    timeout-minutes: ${{ inputs.domain == 'security' && 5 || inputs.domain == 'productivity' && 15 || inputs.domain == 'tcg' && 20 || 30 }}

    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Python
        if: hashFiles(format('{0}/**/requirements*.txt', inputs.working-directory)) != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ${{ inputs.working-directory }}/.venv
            ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Build project
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "🔨 Building ${{ inputs.service-name }}..."

          # Detect project type and use appropriate build command
          if [ -f package.json ]; then
            if npm run | grep -q "build"; then
              npm run build
            elif npm run | grep -q "compile"; then
              npm run compile
            else
              echo "📦 No build script found, trying: ${{ inputs.build-command }}"
              ${{ inputs.build-command }}
            fi
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            source .venv/bin/activate
            if [ -f setup.py ]; then
              python setup.py build
            elif [ -f pyproject.toml ]; then
              pip install build
              python -m build
            else
              echo "🐍 Python project detected but no standard build found"
            fi
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.service-name }}
          path: |
            ${{ inputs.working-directory }}/dist/
            ${{ inputs.working-directory }}/build/
          retention-days: 7

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [setup, dependencies, build]
    if: always() && needs.setup.outputs.should-build == 'true' && !inputs.skip-tests && !cancelled()
    timeout-minutes: ${{ inputs.domain == 'security' && 5 || inputs.domain == 'productivity' && 15 || inputs.domain == 'tcg' && 20 || 30 }}

    outputs:
      results: ${{ job.status }}

    strategy:
      fail-fast: false
      matrix:
        # Executive function accommodation: predictable test execution
        test-type: [unit, integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Python
        if: hashFiles(format('{0}/**/requirements*.txt', inputs.working-directory)) != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ${{ inputs.working-directory }}/.venv
            ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run tests (${{ matrix.test-type }})
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "🧪 Running ${{ matrix.test-type }} tests for ${{ inputs.service-name }}..."

          if [ -f package.json ]; then
            if [ "${{ matrix.test-type }}" = "unit" ]; then
              if npm run | grep -q "test:unit"; then
                npm run test:unit
              elif npm run | grep -q "test"; then
                npm test
              else
                ${{ inputs.test-command }}
              fi
            elif [ "${{ matrix.test-type }}" = "integration" ] && npm run | grep -q "test:integration"; then
              npm run test:integration
            fi
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            source .venv/bin/activate
            if [ "${{ matrix.test-type }}" = "unit" ]; then
              if [ -f pytest.ini ] || [ -f pyproject.toml ]; then
                pytest -v tests/ || python -m pytest -v tests/
              else
                python -m unittest discover
              fi
            fi
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.service-name }}-${{ matrix.test-type }}
          path: |
            ${{ inputs.working-directory }}/coverage/
            ${{ inputs.working-directory }}/test-results/
            ${{ inputs.working-directory }}/.coverage
          retention-days: 30

  report:
    name: Build Report
    runs-on: ubuntu-latest
    needs: [setup, dependencies, lint, build, test]
    if: always() && needs.setup.outputs.should-build == 'true'

    steps:
      - name: Generate build report
        run: |
          echo "## 📊 Build Report for ${{ inputs.service-name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Duration |" >> $GITHUB_STEP_SUMMARY  
          echo "|-------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependencies.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result || 'skipped' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result || 'skipped' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Domain**: ${{ inputs.domain }}" >> $GITHUB_STEP_SUMMARY
          echo "**Performance Tier**: ${{ inputs.domain == 'security' && '<1s target' || inputs.domain == 'productivity' && '<2s target' || inputs.domain == 'tcg' && '<3s target' || '<5s target' }}" >> $GITHUB_STEP_SUMMARY

          # Executive function accommodation: clear success/failure indication
          if [[ "${{ needs.build.result }}" == "success" && ("${{ needs.test.result }}" == "success" || "${{ inputs.skip-tests }}" == "true") ]]; then
            echo "✅ **BUILD SUCCESSFUL** - ${{ inputs.service-name }} is ready for deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **BUILD FAILED** - Please check the logs above for details" >> $GITHUB_STEP_SUMMARY
          fi
