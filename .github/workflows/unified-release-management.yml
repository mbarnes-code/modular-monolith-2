name: Unified Release Management

on:
    workflow_call:
        inputs:
            service-name:
                description: "Name of the service to release"
                required: true
                type: string
            release-type:
                description: "Type of release (patch, minor, major, prerelease)"
                required: false
                type: string
                default: "patch"
            working-directory:
                description: "Working directory for the service"
                required: false
                type: string
                default: "."
            registry:
                description: "Package registry (npm, pypi, docker, github)"
                required: false
                type: string
                default: "github"
            enable-changelog:
                description: "Generate changelog automatically"
                required: false
                type: boolean
                default: true
            enable-github-release:
                description: "Create GitHub release"
                required: false
                type: boolean
                default: true
            enable-notifications:
                description: "Send release notifications"
                required: false
                type: boolean
                default: true
            domain:
                description: "Service domain for release strategy"
                required: false
                type: string
                default: "infrastructure"
            dry-run:
                description: "Perform a dry run without actually releasing"
                required: false
                type: boolean
                default: false
        secrets:
            NPM_TOKEN:
                description: "NPM registry token"
                required: false
            PYPI_TOKEN:
                description: "PyPI registry token"
                required: false
            DOCKER_TOKEN:
                description: "Docker registry token"
                required: false
            SLACK_WEBHOOK:
                description: "Slack webhook for notifications"
                required: false

jobs:
    pre-release:
        name: Pre-Release Validation
        runs-on: ubuntu-latest
        outputs:
            current-version: ${{ steps.version.outputs.current-version }}
            next-version: ${{ steps.version.outputs.next-version }}
            changelog: ${{ steps.changelog.outputs.changelog }}
            should-release: ${{ steps.validate.outputs.should-release }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  registry-url: "https://registry.npmjs.org"

            - name: Setup Python
              if: hashFiles(format('{0}/**/pyproject.toml', inputs.working-directory)) != '' || hashFiles(format('{0}/**/setup.py', inputs.working-directory)) != ''
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Determine current version
              id: version
              working-directory: ${{ inputs.working-directory }}
              run: |
                  echo "🔍 Determining current version for ${{ inputs.service-name }}..."

                  CURRENT_VERSION=""

                  # Node.js project
                  if [ -f package.json ]; then
                    CURRENT_VERSION=$(node -p "require('./package.json').version")
                    echo "📦 Found Node.js package version: ${CURRENT_VERSION}"
                  # Python project  
                  elif [ -f pyproject.toml ]; then
                    if command -v python -c "import tomllib" 2>/dev/null; then
                      CURRENT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" 2>/dev/null || echo "")
                    fi
                    if [ -z "$CURRENT_VERSION" ]; then
                      CURRENT_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed 's/.*=\s*"\(.*\)".*/\1/' || echo "0.1.0")
                    fi
                    echo "🐍 Found Python package version: ${CURRENT_VERSION}"
                  elif [ -f setup.py ]; then
                    CURRENT_VERSION=$(python setup.py --version 2>/dev/null || echo "0.1.0")
                    echo "🐍 Found Python setup.py version: ${CURRENT_VERSION}"
                  else
                    # Look for git tags
                    CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.1.0")
                    echo "🏷️ Found git tag version: ${CURRENT_VERSION}"
                  fi

                  if [ -z "$CURRENT_VERSION" ]; then
                    CURRENT_VERSION="0.1.0"
                    echo "⚠️ No version found, using default: ${CURRENT_VERSION}"
                  fi

                  echo "current-version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

                  # Calculate next version based on release type
                  IFS='.' read -r -a VERSION_PARTS <<< "${CURRENT_VERSION}"
                  MAJOR=${VERSION_PARTS[0]}
                  MINOR=${VERSION_PARTS[1]:-0}
                  PATCH=${VERSION_PARTS[2]:-0}

                  case "${{ inputs.release-type }}" in
                    major)
                      NEXT_VERSION="$((MAJOR + 1)).0.0"
                      ;;
                    minor)
                      NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
                      ;;
                    patch)
                      NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                      ;;
                    prerelease)
                      NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}-rc.$(date +%Y%m%d%H%M)"
                      ;;
                    *)
                      echo "❌ Invalid release type: ${{ inputs.release-type }}"
                      exit 1
                      ;;
                  esac

                  echo "next-version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
                  echo "📈 Next version will be: ${NEXT_VERSION}"

            - name: Validate release conditions
              id: validate
              run: |
                  echo "🔍 Validating release conditions..."

                  SHOULD_RELEASE=true

                  # Check if we're on the main branch for non-prerelease
                  if [[ "${{ inputs.release-type }}" != "prerelease" && "${{ github.ref }}" != "refs/heads/main" ]]; then
                    echo "❌ Releases can only be made from main branch (current: ${{ github.ref }})"
                    SHOULD_RELEASE=false
                  fi

                  # Check for uncommitted changes
                  if ! git diff-index --quiet HEAD --; then
                    echo "❌ Uncommitted changes detected"
                    SHOULD_RELEASE=false
                  fi

                  # Domain-specific validation
                  case "${{ inputs.domain }}" in
                    security)
                      echo "🛡️ Security domain: Enhanced validation required"
                      # Additional security validation would go here
                      ;;
                    productivity)
                      echo "⚡ Productivity domain: Performance validation required"
                      # Performance validation would go here
                      ;;
                    tcg)
                      echo "🎮 TCG domain: Game logic validation required"
                      # Game-specific validation would go here
                      ;;
                  esac

                  if [[ "${{ inputs.dry-run }}" == "true" ]]; then
                    echo "🧪 Dry run mode enabled - will simulate release"
                    SHOULD_RELEASE="dry-run"
                  fi

                  echo "should-release=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT

                  if [[ "$SHOULD_RELEASE" == "false" ]]; then
                    echo "❌ Release validation failed"
                    exit 1
                  fi

            - name: Generate changelog
              id: changelog
              if: inputs.enable-changelog
              working-directory: ${{ inputs.working-directory }}
              run: |
                  echo "📝 Generating changelog for ${{ inputs.service-name }}..."

                  # Get commits since last release
                  LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                  if [ -n "$LAST_TAG" ]; then
                    COMMITS=$(git log --pretty=format:"- %s (%h)" ${LAST_TAG}..HEAD)
                  else
                    COMMITS=$(git log --pretty=format:"- %s (%h)" --max-count=10)
                  fi

                  # Generate changelog content
                  CHANGELOG="## Release ${{ steps.version.outputs.next-version }}

                  **Service**: ${{ inputs.service-name }}
                  **Domain**: ${{ inputs.domain }}
                  **Type**: ${{ inputs.release-type }}
                  **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

                  ### Changes
                  ${COMMITS}

                  ### Executive Function Accommodations
                  - Clear version numbering and release notes
                  - Predictable release process with validation
                  - Domain-specific performance expectations maintained
                  "

                  # Save changelog for later use
                  echo "$CHANGELOG" > RELEASE_CHANGELOG.md

                  # Set output (escape for JSON)
                  CHANGELOG_JSON=$(echo "$CHANGELOG" | jq -Rs .)
                  echo "changelog=${CHANGELOG_JSON}" >> $GITHUB_OUTPUT

    build-artifacts:
        name: Build Release Artifacts
        runs-on: ubuntu-latest
        needs: pre-release
        if: needs.pre-release.outputs.should-release != 'false'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              if: hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  registry-url: "https://registry.npmjs.org"

            - name: Setup Python
              if: hashFiles(format('{0}/**/pyproject.toml', inputs.working-directory)) != '' || hashFiles(format('{0}/**/setup.py', inputs.working-directory)) != ''
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              working-directory: ${{ inputs.working-directory }}
              run: |
                  if [ -f package.json ]; then
                    npm ci --prefer-offline
                  fi

                  if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
                    python -m venv .venv
                    source .venv/bin/activate
                    if [ -f requirements.txt ]; then
                      pip install -r requirements.txt
                    fi
                    pip install build twine
                  fi

            - name: Update version in files
              working-directory: ${{ inputs.working-directory }}
              run: |
                  NEW_VERSION="${{ needs.pre-release.outputs.next-version }}"
                  echo "📝 Updating version to ${NEW_VERSION}"

                  if [ -f package.json ]; then
                    npm version ${NEW_VERSION} --no-git-tag-version
                    echo "✅ Updated package.json version"
                  fi

                  if [ -f pyproject.toml ]; then
                    sed -i "s/^version = .*/version = \"${NEW_VERSION}\"/" pyproject.toml
                    echo "✅ Updated pyproject.toml version"
                  fi

                  if [ -f setup.py ]; then
                    sed -i "s/version=.*/version=\"${NEW_VERSION}\",/" setup.py
                    echo "✅ Updated setup.py version"
                  fi

            - name: Build artifacts
              working-directory: ${{ inputs.working-directory }}
              run: |
                  echo "🔨 Building release artifacts for ${{ inputs.service-name }}..."

                  if [ -f package.json ]; then
                    echo "📦 Building Node.js package..."
                    npm run build || echo "No build script found"
                    npm pack
                  fi

                  if [ -f pyproject.toml ] || [ -f setup.py ]; then
                    echo "🐍 Building Python package..."
                    source .venv/bin/activate
                    python -m build
                  fi

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: release-artifacts-${{ inputs.service-name }}
                  path: |
                      ${{ inputs.working-directory }}/*.tgz
                      ${{ inputs.working-directory }}/dist/
                  retention-days: 30

    security-scan:
        name: Release Security Scan
        uses: ./.github/workflows/security-scanning-suite.yml
        needs: [pre-release, build-artifacts]
        if: needs.pre-release.outputs.should-release != 'false'
        with:
            service-name: ${{ inputs.service-name }}
            working-directory: ${{ inputs.working-directory }}
            domain: ${{ inputs.domain }}
            fail-on-severity: ${{ inputs.domain == 'security' && 'medium' || 'high' }}
        secrets: inherit

    publish-npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        needs: [pre-release, build-artifacts, security-scan]
        if: |
            needs.pre-release.outputs.should-release != 'false' && 
            (inputs.registry == 'npm' || inputs.registry == 'all') && 
            hashFiles(format('{0}/**/package*.json', inputs.working-directory)) != ''
        environment:
            name: npm-registry
            url: https://www.npmjs.com/package/${{ inputs.service-name }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  registry-url: "https://registry.npmjs.org"

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: release-artifacts-${{ inputs.service-name }}
                  path: ${{ inputs.working-directory }}

            - name: Publish to NPM
              working-directory: ${{ inputs.working-directory }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [[ "${{ needs.pre-release.outputs.should-release }}" == "dry-run" ]]; then
                    echo "🧪 Dry run: Would publish to NPM"
                    npm publish --dry-run
                  else
                    echo "📦 Publishing to NPM..."
                    if [[ "${{ inputs.release-type }}" == "prerelease" ]]; then
                      npm publish --tag beta
                    else
                      npm publish
                    fi
                    echo "✅ Published ${{ inputs.service-name }}@${{ needs.pre-release.outputs.next-version }} to NPM"
                  fi

    publish-pypi:
        name: Publish to PyPI
        runs-on: ubuntu-latest
        needs: [pre-release, build-artifacts, security-scan]
        if: |
            needs.pre-release.outputs.should-release != 'false' && 
            (inputs.registry == 'pypi' || inputs.registry == 'all') && 
            (hashFiles(format('{0}/**/pyproject.toml', inputs.working-directory)) != '' || hashFiles(format('{0}/**/setup.py', inputs.working-directory)) != '')
        environment:
            name: pypi-registry
            url: https://pypi.org/project/${{ inputs.service-name }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: release-artifacts-${{ inputs.service-name }}
                  path: ${{ inputs.working-directory }}

            - name: Publish to PyPI
              working-directory: ${{ inputs.working-directory }}
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
              run: |
                  pip install twine

                  if [[ "${{ needs.pre-release.outputs.should-release }}" == "dry-run" ]]; then
                    echo "🧪 Dry run: Would publish to PyPI"
                    twine check dist/*
                  else
                    echo "🐍 Publishing to PyPI..."
                    twine upload dist/*
                    echo "✅ Published ${{ inputs.service-name }}@${{ needs.pre-release.outputs.next-version }} to PyPI"
                  fi

    create-github-release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs:
            [
                pre-release,
                build-artifacts,
                security-scan,
                publish-npm,
                publish-pypi,
            ]
        if: |
            always() && 
            needs.pre-release.outputs.should-release != 'false' && 
            inputs.enable-github-release

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: release-artifacts-${{ inputs.service-name }}
                  path: ./release-artifacts

            - name: Create git tag
              if: needs.pre-release.outputs.should-release != 'dry-run'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  TAG_NAME="v${{ needs.pre-release.outputs.next-version }}"
                  git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME} - ${{ inputs.service-name }}"
                  git push origin "${TAG_NAME}"

            - name: Create GitHub Release
              uses: actions/create-release@v1
              if: needs.pre-release.outputs.should-release != 'dry-run'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: v${{ needs.pre-release.outputs.next-version }}
                  release_name: ${{ inputs.service-name }} v${{ needs.pre-release.outputs.next-version }}
                  body: ${{ fromJson(needs.pre-release.outputs.changelog) }}
                  draft: false
                  prerelease: ${{ inputs.release-type == 'prerelease' }}

            - name: Upload release assets
              if: needs.pre-release.outputs.should-release != 'dry-run'
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./release-artifacts/
                  asset_name: ${{ inputs.service-name }}-${{ needs.pre-release.outputs.next-version }}-artifacts
                  asset_content_type: application/zip

    post-release:
        name: Post-Release Tasks
        runs-on: ubuntu-latest
        needs: [pre-release, create-github-release]
        if: always() && needs.pre-release.outputs.should-release != 'false'

        steps:
            - name: Send notifications
              if: inputs.enable-notifications
              run: |
                  echo "📢 Sending release notifications for ${{ inputs.service-name }}..."

                  # Prepare notification message
                  MESSAGE="🚀 **${{ inputs.service-name }}** v${{ needs.pre-release.outputs.next-version }} Released!

                  **Domain**: ${{ inputs.domain }}
                  **Type**: ${{ inputs.release-type }}
                  **Registry**: ${{ inputs.registry }}

                  **Changes**: See GitHub release for full changelog
                  **Performance**: Maintains ${{ inputs.domain == 'security' && '<1s' || inputs.domain == 'productivity' && '<2s' || inputs.domain == 'tcg' && '<3s' || '<5s' }} response time
                  "

                  if [[ "${{ needs.pre-release.outputs.should-release }}" == "dry-run" ]]; then
                    echo "🧪 Dry run: Would send notification: ${MESSAGE}"
                  else
                    echo "Message prepared: ${MESSAGE}"
                    # In real implementation:
                    # - Send to Slack webhook
                    # - Update service documentation
                    # - Notify dependent services
                    # - Update monitoring dashboards
                  fi

            - name: Update documentation
              run: |
                  echo "📚 Updating release documentation..."

                  # Domain-specific documentation updates
                  case "${{ inputs.domain }}" in
                    security)
                      echo "🛡️ Security domain: Update security documentation"
                      ;;
                    productivity)
                      echo "⚡ Productivity domain: Update user guides"
                      ;;
                    tcg)
                      echo "🎮 TCG domain: Update game mechanics documentation"
                      ;;
                    *)
                      echo "🏗️ Infrastructure domain: Update technical documentation"
                      ;;
                  esac

            - name: Generate release report
              run: |
                  echo "## 🎉 Release Complete: ${{ inputs.service-name }} v${{ needs.pre-release.outputs.next-version }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Aspect | Details |" >> $GITHUB_STEP_SUMMARY
                  echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Service | ${{ inputs.service-name }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Version | ${{ needs.pre-release.outputs.current-version }} → ${{ needs.pre-release.outputs.next-version }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Domain | ${{ inputs.domain }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Type | ${{ inputs.release-type }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Registry | ${{ inputs.registry }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| GitHub Release | ${{ needs.create-github-release.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Mode | ${{ needs.pre-release.outputs.should-release == 'dry-run' && '🧪 Dry Run' || '✅ Live Release' }} |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [[ "${{ needs.pre-release.outputs.should-release }}" == "dry-run" ]]; then
                    echo "🧪 **DRY RUN COMPLETED** - No actual release was performed" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "🎉 **RELEASE SUCCESSFUL** - ${{ inputs.service-name }} v${{ needs.pre-release.outputs.next-version }} is now available" >> $GITHUB_STEP_SUMMARY
                  fi

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Executive Function Accommodations Applied**:" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Clear version progression and release notes" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Predictable release process with validation gates" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Domain-specific performance expectations maintained" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Comprehensive release artifacts and documentation" >> $GITHUB_STEP_SUMMARY
