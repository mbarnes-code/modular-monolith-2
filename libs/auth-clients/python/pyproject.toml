[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-monolith-auth-client"
version = "1.0.0"
description = "Python client for Modular Monolith Authentication Service"
readme = "README.md"
authors = [
    {name = "Modular Monolith Team"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["authentication", "oauth2", "sso", "modular-monolith"]
dependencies = [
    "requests>=2.25.0",
    "typing-extensions>=4.0.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
fastapi = ["fastapi>=0.68.0"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "mypy>=0.900",
]

[project.urls]
Homepage = "https://github.com/mbarnes-code/modular-monolith-2"
Repository = "https://github.com/mbarnes-code/modular-monolith-2"
Documentation = "https://github.com/mbarnes-code/modular-monolith-2/tree/main/libs/auth-clients"

[tool.setuptools.packages.find]
where = ["."]
include = ["auth_client*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true