[tool:pytest]
# MISP Test Configuration
# Purpose: Pytest configuration for MISP integration testing
# Requirements: Section 7.1-7.2 testing requirements from misp-analysis.md

# Test discovery and execution
testpaths = tests/security/MISP
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    --durations=10
    --cov-report=term-missing
    --cov-report=html:tests/security/MISP/htmlcov
    --cov-branch
    --asyncio-mode=auto

# Coverage configuration
[coverage:run]
source = 
    apps/jane-orchestrator/src/libs/service_adapters/security/misp_adapter.py
    apps/jane-orchestrator/src/services/security_service.py
    apps/jane-orchestrator/src/api/security.py
    apps/jane-orchestrator/src/data/models/security_profile.py

branch = true
omit = 
    */tests/*
    */venv/*
    */node_modules/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Performance thresholds
show_missing = true
skip_covered = false
precision = 2

# Markers for test categorization
markers =
    threat_intelligence: Tests for threat intelligence core functionality
    api_integration: Tests for API compatibility and integration
    performance: Performance benchmark tests
    security: Security-specific functionality tests
    correlation: Threat correlation algorithm tests
    feeds: External feed integration tests
    regression: Regression tests against original MISP behavior
    slow: Tests that take significant time to execute
    integration: Integration tests requiring external dependencies
    unit: Fast unit tests that can run in isolation

# Asyncio configuration for async tests
asyncio_mode = auto

# Timeout configuration for long-running tests
timeout = 300

# Fail fast configuration
maxfail = 5

# Minimum required coverage percentages
[coverage:html]
directory = tests/security/MISP/htmlcov

[coverage:xml]
output = tests/security/MISP/coverage.xml