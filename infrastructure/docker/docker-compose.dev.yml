version: '3.8'

services:
  jane-ui:
    build:
      context: ../../
      dockerfile: apps/jane-ui/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://jane-orchestrator:8000
      - LOG_LEVEL=DEBUG
    volumes:
      - ../../apps/jane-ui:/app
      - /app/node_modules
    depends_on:
      - jane-orchestrator
    networks:
      - jane-network

  jane-orchestrator:
    build:
      context: ../../
      dockerfile: apps/jane-orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - CYBER_LLM_URL=http://cyber-llm:8001
      - MTG_LLM_URL=http://mtg-llm:8002
      - CODE_LLM_URL=http://code-llm:8003
    volumes:
      - ../../apps/jane-orchestrator:/app
    depends_on:
      - cyber-llm
      - mtg-llm
      - code-llm
    networks:
      - jane-network

  cyber-llm:
    build:
      context: ../../
      dockerfile: apps/cyber-llm-server/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - MODEL_NAME=cyber-model
    volumes:
      - ../../apps/cyber-llm-server:/app
    networks:
      - jane-network

  mtg-llm:
    build:
      context: ../../
      dockerfile: apps/mtg-llm-server/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - MODEL_NAME=mtg-model
    volumes:
      - ../../apps/mtg-llm-server:/app
    networks:
      - jane-network

  code-llm:
    build:
      context: ../../
      dockerfile: apps/code-llm-server/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - MODEL_NAME=code-model
    volumes:
      - ../../apps/code-llm-server:/app
    networks:
      - jane-network

networks:
  jane-network:
    driver: bridge
