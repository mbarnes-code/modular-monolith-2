apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-llm
  labels:
    app: cyber-llm
    app.kubernetes.io/name: cyber-llm
    app.kubernetes.io/component: llm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyber-llm
  template:
    metadata:
      labels:
        app: cyber-llm
    spec:
      containers:
      - name: cyber-llm
        image: cyber-llm:latest
        ports:
        - containerPort: 8001
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: MODEL_NAME
          value: "cyber-model"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: cyber-llm
  labels:
    app: cyber-llm
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
  selector:
    app: cyber-llm
