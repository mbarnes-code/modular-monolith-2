apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jane-services

bases:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

patchesStrategicMerge:
  - replica-patch.yaml
  - hpa-patch.yaml

configMapGenerator:
  - name: environment-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
