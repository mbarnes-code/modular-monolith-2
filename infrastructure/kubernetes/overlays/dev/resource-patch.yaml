apiVersion: apps/v1
kind: Deployment
metadata:
  name: jane-ui
spec:
  template:
    spec:
      containers:
      - name: jane-ui
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jane-orchestrator
spec:
  template:
    spec:
      containers:
      - name: jane-orchestrator
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
