apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jane-services

bases:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

patchesStrategicMerge:
  - replica-patch.yaml

configMapGenerator:
  - name: environment-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
