<VirtualHost *:80>
    ServerName misp.local
    DocumentRoot /var/www/html/src/app/webroot
    
    <Directory /var/www/html/src/app/webroot>
        Options -Indexes
        AllowOverride All
        Require all granted
        
        # CakePHP URL rewriting
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    <Directory /var/www/html/src/app>
        Require all denied
    </Directory>
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/misp_error.log
    CustomLog ${APACHE_LOG_DIR}/misp_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName misp.local
    DocumentRoot /var/www/html/src/app/webroot
    
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/misp.crt
    SSLCertificateKeyFile /etc/ssl/private/misp.key
    
    <Directory /var/www/html/src/app/webroot>
        Options -Indexes
        AllowOverride All
        Require all granted
        
        # CakePHP URL rewriting
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    <Directory /var/www/html/src/app>
        Require all denied
    </Directory>
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/misp_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/misp_ssl_access.log combined
</VirtualHost>