[project]
name = "dispatch-service"
version = "0.1.0"
description = "Dispatch Integration Service - Incident Management and Orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.37.0",
    "pydantic>=2.12.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=1.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "click>=8.0.0",
    "cryptography>=38.0.0,<47",
    "cachetools>=5.0.0",
    "attrs>=22.2.0",
    "chardet>=5.0.0",
    # Local dependencies
    "dispatch-core",
    "dispatch-database",
]

[project.optional-dependencies]
dev = [
    "black==24.3.0",
    "ruff==0.3.4",
    "mypy==1.9.0",
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.0",
    "easydict>=1.10",
    "slack-sdk>=3.0.0",
    "sqlalchemy-utils>=0.41.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true