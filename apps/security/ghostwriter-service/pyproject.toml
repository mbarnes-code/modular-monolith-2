[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwriter-service"
version = "0.1.0"
description = "Ghostwriter offensive security operations platform - NX service"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "SpecterOps", email = "info@specterops.io"},
    {name = "NX Integration", email = "noreply@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"
dependencies = [
    "django>=4.2,<5.0",
    "django-environ>=0.10.0",
    "python-slugify>=8.0.0",
    "Pillow>=10.4.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "django-debug-toolbar>=4.0.0",
    "factory-boy>=3.2.0",
]
prod = [
    "gunicorn>=21.0.0",
    "psycopg2-binary>=2.9.0",
    "whitenoise>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/GhostManager/Ghostwriter"
Documentation = "https://ghostwriter.wiki/"
Repository = "https://github.com/GhostManager/Ghostwriter"
"Bug Tracker" = "https://github.com/GhostManager/Ghostwriter/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ghostwriter*", "config*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
exclude = [
    "migrations/",
    "static/",
    "media/",
    "venv/",
    "env/",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--cov=src/ghostwriter",
    "--cov=src/config",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
testpaths = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/static/*",
    "*/media/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "*/settings/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]