[project]
name = "jane-orchestrator"
version = "0.1.0"
description = "Jane Orchestrator Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.119.0",
    "uvicorn==0.38.0",
    "pydantic==2.12.0",
    "sqlalchemy==2.0.0",
    "psycopg2-binary==2.9.9",
    "redis==7.1.0",
    "alembic==1.13.0",
    # MISP dependencies (T1915d - Package Dependencies Migration)
    "pymisp>=2.5.17,<3.0.0",
    "requests>=2.31.0,<3.0.0",  
    "python-magic>=0.4.27,<1.0.0",
    "pyzmq>=25.1.1,<26.0.0",
    "stix2>=3.0.0,<4.0.0",
    "cybox>=2.1.0.21,<3.0.0",
    "maec>=4.1.0.17,<5.0.0",
    "mixbox>=1.0.5,<2.0.0",
    "plyara>=2.1.1,<3.0.0",
    "pydeep2>=0.5.1,<1.0.0",
    "jsonschema>=4.19.1,<5.0.0",
    "lief>=0.13.1,<1.0.0",
    # Additional dependencies for unified configuration
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    # HTTP client with retry support
    "urllib3>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "black==24.3.0",
    "ruff==0.3.4",
    "mypy==1.9.0",
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
